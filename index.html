  // ============================================================
  // CHECK STATUS (เช็คสถานะวันนี้ของพนักงานจาก Sheet)
  // ============================================================
  let todayStatus = { checkin: false, checkout: false };
  let statusCheckTimeout = null;
  let statusRequestId = 0;
  // บั๊ค (แก้แล้ว): เดิมถ้าเปลี่ยนพนักงาน 2 คนเร็วๆ ก่อน fetch ของคนแรก
  // ตอบกลับ (เช่น เน็ตช้าจังหวะนั้น) response ที่มาช้ากว่าจะทับ todayStatus
  // ของคนที่เพิ่งเลือกไป ทำให้ chip/ปุ่มบันทึกโชว์สถานะผิดคน — ใช้
  // statusRequestId ทิ้ง response ที่ไม่ใช่ของ request ล่าสุดแทน

  async function checkEmployeeStatus(name) {
    if (!name || !GAS_URL) return;
    const myRequestId = ++statusRequestId;

    const bar = document.getElementById('status-bar');
    const chipIn  = document.getElementById('chip-in');
    const chipOut = document.getElementById('chip-out');
    const chipInTxt  = document.getElementById('chip-in-text');
    const chipOutTxt = document.getElementById('chip-out-text');

    bar.style.display = 'flex';
    chipIn.className  = 'status-chip loading';
    chipOut.className = 'status-chip loading';
    chipInTxt.textContent  = 'กำลังตรวจสอบ...';
    chipOutTxt.textContent = 'กำลังตรวจสอบ...';

    try {
      const url = GAS_URL + '?action=status&name=' + encodeURIComponent(name);
      const res = await fetch(url, { method: 'GET', redirect: 'follow' });
      const text = await res.text();
      const data = JSON.parse(text);
      if (myRequestId !== statusRequestId) return; // มีการเปลี่ยนพนักงานไปแล้ว ทิ้งผลลัพธ์อันนี้
      todayStatus = data;
    } catch (err) {
      if (myRequestId !== statusRequestId) return;
      console.warn('checkEmployeeStatus error:', err);
      // ถ้าเช็คไม่ได้ ให้ผ่านไปก่อน
      todayStatus = { checkin: false, checkout: false };
    }
    if (myRequestId !== statusRequestId) return; // กันอัปเดต UI ผิดคนด้วย

    // รายการที่ยังรอส่งอยู่ในคิว (outbox) ยังไม่ถึง server — ต้องนับรวมด้วย
    // ไม่งั้น server จะตอบว่า "ยังไม่ Check-in" แล้วปุ่มปลดล็อกให้กดซ้ำได้
    applyPendingToStatus(name, todayStatus);
    renderStatusChips();

    // อัปเดตปุ่มบันทึก
    updateSubmitButton();
  }

  function renderStatusChips() {
    const chipIn  = document.getElementById('chip-in');
    const chipOut = document.getElementById('chip-out');
    chipIn.className  = todayStatus.checkin  ? 'status-chip done-in'  : 'status-chip';
    chipOut.className = todayStatus.checkout ? 'status-chip done-out' : 'status-chip';
    document.getElementById('chip-in-text').textContent  = todayStatus.checkin  ? '✓ Check-in แล้ว'  : 'ยังไม่ Check-in';
    document.getElementById('chip-out-text').textContent = todayStatus.checkout ? '✓ Check-out แล้ว' : 'ยังไม่ Check-out';
  }

  function updateCaptureButton() {
    const btn = document.getElementById('capture-btn');
    const hint = document.getElementById('face-hint');
    if (!btn) return;
    // ล็อคปุ่มถ่ายรูปถ้า model โหลดแล้วแต่ยังไม่เจอหน้า
    if (faceApiReady && faceModel && !faceDetected) {
      btn.disabled = true;
      if (hint) hint.style.display = 'flex';
    } else {
      btn.disabled = false;
      if (hint) hint.style.display = 'none';
    }
  }

  function updateSubmitButton() {
    const submitBtn = document.getElementById('submit-btn');
    const btnLabel  = document.getElementById('btn-label');
    const name      = document.getElementById('name-input').value.trim();
    const hasPhoto  = !!capturedImageBase64;

    // helper: ตั้งค่าปุ่ม
    function lock(text)   { submitBtn.disabled = true;  btnLabel.textContent = text; }
    function unlock(text) { submitBtn.disabled = false; btnLabel.textContent = text; }

    // ── ยังไม่ถ่ายรูป ────────────────────────────────────────────
    if (!hasPhoto) {
      lock(currentType === 'in' ? '📷 ถ่ายรูปก่อนเข้างาน' : '📷 ถ่ายรูปก่อนออกงาน');
      return;
    }

    // ── ยังไม่เลือกชื่อ ──────────────────────────────────────────
    if (!name) {
      lock(currentType === 'in' ? '— เลือกชื่อพนักงาน —' : '— เลือกชื่อพนักงาน —');
      return;
    }

    // ── มีรูป + มีชื่อ: ตรวจสถานะวันนี้ ─────────────────────────
    if (currentType === 'in') {
      todayStatus.checkin ? lock('✓ Check-in วันนี้แล้ว') : unlock('✓ บันทึกเข้างาน');
    } else {
      if (todayStatus.checkout)     lock('✓ Check-out วันนี้แล้ว');
      else if (!todayStatus.checkin) lock('⚠ ต้อง Check-in ก่อน');
      else                           unlock('✕ บันทึกออกงาน');
    }
  }

  // ============================================================
  // OUTBOX — ส่งข้อมูลเบื้องหลัง (โชว์สำเร็จทันที ไม่ต้องรอ server)
  //
  // เดิม submitData() รอ Apps Script ตอบกลับก่อนโชว์ป็อปอัพ (~2–4 วิ ส่วนใหญ่
  // เป็นเวลาขั้นต่ำของ Apps Script เองที่ลดไม่ได้) ตอนนี้เปลี่ยนเป็น:
  //   1) กดบันทึก → เก็บรายการลง "outbox" (localStorage) → โชว์ป็อปอัพทันที
  //   2) ส่งไป server เบื้องหลัง ป็อปอัพ/ประวัติจะอัปเดตเป็น "✓ บันทึกลงระบบแล้ว"
  //   3) ส่งไม่ผ่าน (เน็ตหลุด/ระบบยุ่ง) → เก็บไว้ในเครื่อง แล้วลองส่งใหม่เองทุก
  //      15 วิ / ตอนเน็ตกลับมา / ตอนเปิดหน้าเว็บครั้งถัดไป
  //
  // กันเวลาเพี้ยน: เวลาที่บันทึกคือเวลาที่ server ได้รับ (ไม่เชื่อนาฬิกาเครื่อง
  // กันการแก้เวลาเครื่องโกง) รายการที่ค้างเกิน OUTBOX_MAX_AGE_MS จะไม่ถูกส่ง
  // (เพราะเวลาจะคลาดจากจริงมาก หรือกลายเป็นของวันถัดไป) แต่จะแจ้งให้บันทึกใหม่แทน
  //
  // ปิดแท็บ: ใช้ fetch keepalive (ถ้าขนาดข้อมูล < 60KB) ทำให้ browser ส่งต่อจนจบ
  // แม้ปิดแท็บไปแล้ว — แต่ถ้าปิดฝาโน้ตบุ๊ก/ล็อกจอมือถือก่อนส่งเสร็จ เครื่องจะ
  // หยุดส่ง แล้วค่อยส่งต่อเมื่อเปิดหน้าเว็บอีกครั้ง (ภายในเวลาที่กำหนด)
  // ============================================================
  const OUTBOX_KEY        = 'pending_submissions';
  const OUTBOX_MAX_AGE_MS = 10 * 60 * 1000; // 10 นาที
  // ลองส่งใหม่เร็วๆ ก่อน แล้วค่อยห่างขึ้น (เดิมรอ 15 วิทุกครั้ง ทำให้แค่ชนจังหวะ
  // ระบบยุ่งครั้งเดียวก็ค้าง "กำลังส่ง" นานเกินจำเป็น)
  const RETRY_DELAYS_MS   = [2000, 4000, 8000, 15000];
  const MAX_ERROR_RETRIES = 5;              // "Error:" จาก server ลองซ้ำได้กี่ครั้ง
  const KEEPALIVE_LIMIT   = 60000;          // browser จำกัด keepalive body ~64KB

  let outbox = loadOutbox();
  let outboxBusy = false;
  let retryTimer = null;
  let popupItemId = null; // รายการที่ป็อปอัพกำลังแสดงอยู่ (ใช้อัปเดตบรรทัดสถานะ)

  function loadOutbox() {
    try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveOutbox() {
    try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(outbox)); }
    catch (e) { console.warn('saveOutbox error (เก็บไว้ในหน่วยความจำแทน):', e); }
  }

  function sameDay(ts1, ts2) {
    return new Date(ts1).toDateString() === new Date(ts2).toDateString();
  }

  // รวมรายการที่ยังรอส่งของคนนี้ (วันนี้) เข้าไปในสถานะ
  function applyPendingToStatus(name, status) {
    outbox.forEach(item => {
      if (item.name !== name || !sameDay(item.createdAt, Date.now())) return;
      if (item.type === 'เข้างาน') status.checkin  = true;
      if (item.type === 'ออกงาน') status.checkout = true;
    });
  }

  function enqueueSubmission(name, type, image) {
    const item = {
      id: 'sub_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      name, type, image,
      createdAt: Date.now(),
      attempts: 0
    };
    outbox.push(item);
    saveOutbox();
    return item;
  }

  async function sendSubmission(item) {
    // นับครั้งที่ส่ง "ก่อน" ยิงจริง แล้ว save ลงเครื่อง — ถ้าหน้าเว็บถูกปิดระหว่างส่ง
    // (request อาจไปถึง server แล้ว แต่เราไม่ได้อ่านคำตอบ) รอบหน้าที่ได้ Duplicate
    // จะรู้ว่านั่นคือรายการของเราเองที่ส่งสำเร็จไปแล้ว ไม่ใช่การกดซ้ำ
    item.attempts++;
    saveOutbox();

    const payload = JSON.stringify({ name: item.name, type: item.type, image: item.image });
    const __clientT0 = performance.now();
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: payload,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      redirect: 'follow',
      keepalive: payload.length < KEEPALIVE_LIMIT
    });
    const text = await res.text();

    const __clientTotalMs = Math.round(performance.now() - __clientT0);
    const __srvMatch = text.match(/srvms=(\d+)/);
    const __srvMs = __srvMatch ? parseInt(__srvMatch[1], 10) : null;
    console.log(
      `[timing] client round-trip: ${__clientTotalMs}ms` +
      (__srvMs !== null ? ` | server execution: ${__srvMs}ms | network+platform overhead: ~${__clientTotalMs - __srvMs}ms` : ' | (no server timing in response)')
    );
    console.log('Apps Script response:', text);

    if (text.startsWith('Success'))   return { kind: 'success' };
    if (text.startsWith('Duplicate')) return item.attempts > 1
      ? { kind: 'success' }                                    // รอบก่อนส่งถึงแล้ว
      : { kind: 'dup', msg: text.replace('Duplicate: ', '') };
    if (text.startsWith('NoCheckin')) return { kind: 'rejected', msg: 'ยังไม่ได้ Check-in วันนี้' };
    if (text.includes('ระบบกำลังยุ่ง')) return { kind: 'retry', msg: 'ระบบกำลังยุ่ง' };
    if (item.attempts < MAX_ERROR_RETRIES) return { kind: 'retry', msg: text };
    return { kind: 'rejected', msg: (text || 'ไม่ได้รับการตอบกลับ').slice(0, 80) };
  }

  async function processOutbox() {
    if (outboxBusy || !GAS_URL) return;
    outboxBusy = true;
    clearTimeout(retryTimer); retryTimer = null;
    try {
      while (outbox.length > 0) {
        const item = outbox[0];

        if (Date.now() - item.createdAt > OUTBOX_MAX_AGE_MS) {
          await finishExpired(item);
          continue;
        }

        let result;
        try {
          result = await sendSubmission(item);
        } catch (err) {
          // เน็ตหลุด / fetch ล้มเหลว → ลองใหม่ทีหลัง
          result = { kind: 'retry', msg: err.message || 'เชื่อมต่อไม่ได้' };
        }

        if (result.kind === 'retry') {
          console.warn('ส่งไม่สำเร็จ จะลองใหม่:', result.msg);
          item.lastError = result.msg;
          saveOutbox();
          setSyncStatus(item, 'retry');
          // แสดงเหตุผลในประวัติด้วย จะได้รู้ว่าค้างเพราะอะไร (เน็ต / ระบบยุ่ง / error)
          updateHistory(item.id, 'pending', 'ลองส่งใหม่ครั้งที่ ' + item.attempts + ': ' + String(result.msg).slice(0, 60));
          const delay = RETRY_DELAYS_MS[Math.min(item.attempts - 1, RETRY_DELAYS_MS.length - 1)] || 2000;
          retryTimer = setTimeout(processOutbox, delay);
          break;
        }
        finishItem(item, result);
      }
    } finally {
      outboxBusy = false;
    }
  }

  function removeFromOutbox(item) {
    outbox = outbox.filter(x => x.id !== item.id);
    saveOutbox();
  }

  function finishItem(item, result) {
    removeFromOutbox(item);
    const nick = item.name.match(/\(([^)]+)\)/)?.[1] || item.name;

    if (result.kind === 'success') {
      updateHistory(item.id, 'success');
      setSyncStatus(item, 'ok');
      return;
    }
    if (result.kind === 'dup') {
      updateHistory(item.id, 'dup', 'มีข้อมูลในระบบอยู่แล้ว');
      setSyncStatus(item, 'dup');
      showToast('⚠️ ' + result.msg, 'error');
    } else {
      updateHistory(item.id, 'error', result.msg);
      setSyncStatus(item, 'err', result.msg);
      showToast('❌ ' + nick + ' ' + item.type + ' ไม่สำเร็จ: ' + result.msg, 'error');
    }
    refreshStatusIfSelected(item.name);
  }

  // รายการค้างนานเกินไป — ไม่ส่งแล้ว (กันเวลาเพี้ยน/ข้ามวัน) แต่ถ้าเคยยิงไปแล้ว
  // อาจถึง server แล้วก็ได้ → เช็คสถานะจริงก่อนตัดสินว่าสำเร็จหรือไม่
  async function finishExpired(item) {
    removeFromOutbox(item);
    const nick = item.name.match(/\(([^)]+)\)/)?.[1] || item.name;
    const when = new Date(item.createdAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

    if (item.attempts > 0 && sameDay(item.createdAt, Date.now())) {
      try {
        const res = await fetch(GAS_URL + '?action=status&name=' + encodeURIComponent(item.name), { redirect: 'follow' });
        const st = JSON.parse(await res.text());
        const done = item.type === 'เข้างาน' ? st.checkin : st.checkout;
        if (done) { updateHistory(item.id, 'success'); return; }
      } catch (e) { /* เช็คไม่ได้ → ถือว่าไม่ทราบผล ด้านล่าง */ }
    }

    const msg = item.attempts > 0
      ? 'ไม่ทราบผล กรุณาตรวจสอบใน Sheet'
      : 'ส่งไม่ทันเวลา กรุณาบันทึกใหม่';
    updateHistory(item.id, 'error', msg);
    showToast('❌ ' + nick + ' ' + item.type + ' (' + when + ') ' + msg, 'error');
    refreshStatusIfSelected(item.name);
  }

  function refreshStatusIfSelected(name) {
    const sel = document.getElementById('name-input').value.trim();
    if (sel === name) checkEmployeeStatus(name);
  }

  function setSyncStatus(item, state, msg) {
    if (popupItemId !== item.id) return;
    const el = document.getElementById('popup-sync-label');
    const isIn = item.type === 'เข้างาน';
    if (state === 'pending') { el.className = 'popup-sync pending'; el.textContent = '⏳ กำลังบันทึกลงระบบ...'; }
    if (state === 'retry')   { el.className = 'popup-sync pending'; el.textContent = '📶 ยังส่งไม่สำเร็จ กำลังลองส่งใหม่อัตโนมัติ...'; }
    if (state === 'ok')      { el.className = 'popup-sync ' + (isIn ? 'ok-in' : 'ok-out'); el.textContent = '✓ บันทึกลงระบบแล้ว'; }
    if (state === 'dup')     { el.className = 'popup-sync err'; el.textContent = '⚠ มีข้อมูลในระบบอยู่แล้ว'; }
    if (state === 'err')     { el.className = 'popup-sync err'; el.textContent = '✗ บันทึกไม่สำเร็จ: ' + (msg || ''); }
  }

  // เตือนก่อนปิดแท็บ/รีโหลด ถ้ายังมีรายการที่ส่งไม่เสร็จ (ใช้ได้บนคอม — มือถือ
  // ส่วนใหญ่ไม่แสดงกล่องเตือนนี้ แต่ข้อมูลยังค้างใน outbox รอส่งรอบหน้า)
  window.addEventListener('beforeunload', (e) => {
    if (outbox.length > 0) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('online', () => processOutbox());
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && outbox.length > 0) processOutbox();
  });

  // ============================================================
  // SUBMIT
  // ============================================================
  function submitData() {
    const name = document.getElementById('name-input').value.trim();
    if (!name) {
      showToast('⚠️ กรุณาเลือกชื่อพนักงานก่อน', 'error');
      document.getElementById('name-input').focus();
      return;
    }
    if (!GAS_URL) {
      showToast('⚙️ ไม่พบ URL ของ Apps Script', 'error');
      return;
    }

    // ตรวจรูปก่อน (ก่อน disable ปุ่ม)
    if (!capturedImageBase64) {
      showToast('📷 กรุณาถ่ายรูปก่อนบันทึก', 'error');
      return;
    }

    const typeLabel = currentType === 'in' ? 'เข้างาน' : 'ออกงาน';

    // ตรวจสอบสถานะฝั่ง client
    if (typeLabel === 'เข้างาน' && todayStatus.checkin) {
      const nick = name.match(/\(([^)]+)\)/)?.[1] || name;
      showToast('⚠️ ' + nick + ' Check-in วันนี้แล้ว', 'error');
      return;
    }
    if (typeLabel === 'ออกงาน' && todayStatus.checkout) {
      const nick = name.match(/\(([^)]+)\)/)?.[1] || name;
      showToast('⚠️ ' + nick + ' Check-out วันนี้แล้ว', 'error');
      return;
    }
    if (typeLabel === 'ออกงาน' && !todayStatus.checkin) {
      showToast('⚠️ ยังไม่ได้ Check-in วันนี้', 'error');
      return;
    }

    // ── เข้าคิวส่ง แล้วโชว์ผลทันที (ไม่รอ server) ────────────────
    const imageData = capturedImageBase64;
    const item = enqueueSubmission(name, typeLabel, imageData);
    const nickname = name.match(/\(([^)]+)\)/)?.[1] || name;

    addHistory(name, typeLabel, 'pending', '', item.id);
    localStorage.setItem('saved_name', name);

    // อัปเดตสถานะทันที (กันกดซ้ำระหว่างรอส่ง)
    if (typeLabel === 'เข้างาน')  todayStatus.checkin  = true;
    if (typeLabel === 'ออกงาน') todayStatus.checkout = true;
    renderStatusChips();

    popupItemId = item.id;
    showSuccessPopup(nickname, typeLabel, imageData);
    setSyncStatus(item, 'pending');

    // บั๊ค (แก้แล้ว): เดิมรูปที่ถ่ายไว้จะค้างอยู่ในตัวแปรหลังบันทึกสำเร็จ
    // ถ้าพนักงานคนถัดไปมาสแกนต่อโดยไม่ได้สลับปุ่ม เข้างาน/ออกงาน ระบบจะยอมให้
    // กดบันทึกได้ทันทีโดยใช้ "รูปของคนก่อนหน้า" ซ้ำ (เพราะ hasPhoto ยัง true อยู่)
    // จึงต้องรีเซ็ตกล้อง/รูปถ่ายทุกครั้งที่บันทึกสำเร็จ เพื่อบังคับถ่ายรูปใหม่เสมอ
    retakePhoto();

    processOutbox();
  }

  // ============================================================
  // SUCCESS POPUP
  // ============================================================
  function showSuccessPopup(nickname, typeLabel, photoBase64) {
    const isIn   = typeLabel === 'เข้างาน';
    const now    = new Date();
    const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    const dateStr = now.toLocaleDateString('th-TH', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

    // ── ตั้งค่า elements ────────────────────────────────────────
    const wrap   = document.getElementById('popup-icon-wrap');
    const glow   = document.getElementById('popup-glow');
    const svgEl  = document.getElementById('popup-icon-svg');
    const typeEl = document.getElementById('popup-type-label');
    const nameEl = document.getElementById('popup-name-label');
    const msgEl  = document.getElementById('popup-msg-label');
    const timeEl = document.getElementById('popup-time-label');
    const dateEl = document.getElementById('popup-date-label');
    const closeBtn = document.getElementById('popup-close-btn');
    const photoEl  = document.getElementById('popup-photo');

    wrap.className   = isIn ? 'popup-icon-wrap icon-in' : 'popup-icon-wrap icon-out';
    glow.className   = isIn ? 'popup-glow glow-in' : 'popup-glow glow-out';
    typeEl.className = isIn ? 'popup-type type-in' : 'popup-type type-out';
    closeBtn.className = isIn ? 'popup-close close-in' : 'popup-close close-out';

    // icon SVG
    svgEl.innerHTML = isIn
      ? `<polyline points="8,22 18,32 36,14" stroke="#00e5a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`
      : `<line x1="12" y1="12" x2="32" y2="32" stroke="#ff4d6d" stroke-width="4" stroke-linecap="round"/>
         <line x1="32" y1="12" x2="12" y2="32" stroke="#ff4d6d" stroke-width="4" stroke-linecap="round"/>`;

    typeEl.textContent = isIn ? '✦ CHECK IN ✦' : '✦ CHECK OUT ✦';
    nameEl.textContent = nickname;
    msgEl.textContent  = isIn ? 'บันทึกเข้างานแล้ว 🎉' : 'บันทึกออกงานแล้ว 👋';
    timeEl.textContent = timeStr;
    dateEl.textContent = dateStr;

    // รูปถ่าย
    if (photoBase64) {
      photoEl.src = photoBase64;
      photoEl.style.display = 'block';
      photoEl.style.borderColor = isIn ? 'var(--accent-in)' : 'var(--accent-out)';
    } else {
      photoEl.style.display = 'none';
    }

    // ── สร้าง confetti ────────────────────────────────────────
    spawnParticles(isIn);

    // ── แสดง popup ────────────────────────────────────────────
    const popup = document.getElementById('success-popup');
    popup.style.opacity = '';
    popup.className = 'show';

    // ปิดอัตโนมัติหลัง 5 วินาที
    clearTimeout(window._popupTimer);
    window._popupTimer = setTimeout(closeSuccessPopup, 5000);
  }

  function closeSuccessPopup() {
    clearTimeout(window._popupTimer);
    popupItemId = null;
    const popup = document.getElementById('success-popup');
    popup.className = 'hide';
    setTimeout(() => { popup.className = ''; popup.style.opacity = '0'; }, 300);
  }

  function spawnParticles(isIn) {
    const container = document.getElementById('popup-particles');
    container.innerHTML = '';
    const colors = isIn
      ? ['#00e5a0','#00c87a','#4dffc8','#b3ffe4','#fff']
      : ['#ff4d6d','#e0304f','#ff8fa3','#ffd6de','#fff'];
    const cx = 180, cy = 120; // rough center of card
    for (let i = 0; i < 30; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      const angle = (Math.random() * 360) * Math.PI / 180;
      const dist  = 80 + Math.random() * 140;
      const tx    = Math.cos(angle) * dist;
      const ty    = Math.sin(angle) * dist - 60;
      const rot   = (Math.random() - 0.5) * 720;
      el.style.cssText = `
        left: ${cx + (Math.random()-0.5)*60}px;
        top:  ${cy + (Math.random()-0.5)*40}px;
        background: ${colors[Math.floor(Math.random()*colors.length)]};
        --tx: ${tx}px; --ty: ${ty}px; --rot: ${rot}deg;
        animation-delay: ${Math.random()*0.3}s;
        animation-duration: ${0.9 + Math.random()*0.5}s;
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      `;
      container.appendChild(el);
    }
  }

  // ============================================================
  // MANAGE EMPLOYEES
  // ============================================================
  // รายชื่อเริ่มต้น (ฝังในโค้ด)
  const DEFAULT_EMPLOYEES = [
    "Mr. Myo Thiha (Mo)",
    "Ms. Aree Songchansitto (Ann)",
    "Mr. Saw Kha Mu Htoo (Linn)",
    "Ms. Paweena Pinnarong (New)",
    "Ms. Patama Pumipuk (Pat)",
  ];

  function loadEmployees() {
    const saved = localStorage.getItem('employees');
    if (saved) {
      try { return JSON.parse(saved); } catch(e) {}
    }
    return [...DEFAULT_EMPLOYEES];
  }

  function saveEmployees(list) {
    localStorage.setItem('employees', JSON.stringify(list));
  }

  function renderDropdown() {
    const sel = document.getElementById('name-input');
    const current = sel.value;
    const employees = loadEmployees();
    sel.innerHTML = '<option value="">— กรุณาเลือกชื่อ —</option>';
    employees.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      if (name === current) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function renderEmpList() {
    const list = document.getElementById('emp-list');
    const employees = loadEmployees();
    if (!employees.length) {
      list.innerHTML = '<div style="text-align:center;color:var(--text-dim);font-size:13px;padding:8px 0">ยังไม่มีรายชื่อ</div>';
      return;
    }
    list.innerHTML = employees.map((name, i) => `
      <div class="emp-item">
        <span style="color:var(--text-dim);font-size:12px;font-family:Space Mono,monospace;min-width:20px">${i+1}.</span>
        <span class="emp-item-name">${escapeHTML(name)}</span>
        <button class="emp-delete-btn" onclick="deleteEmployee(${i})" title="ลบ">🗑</button>
      </div>
    `).join('');
  }

  function addEmployee() {
    const input = document.getElementById('emp-add-input');
    const name = input.value.trim();
    if (!name) { showToast('⚠️ กรุณากรอกชื่อพนักงาน', 'error'); return; }
    const employees = loadEmployees();
    if (employees.includes(name)) {
      showToast('⚠️ มีชื่อนี้อยู่แล้ว', 'error'); return;
    }
    employees.push(name);
    saveEmployees(employees);
    input.value = '';
    renderDropdown();
    renderEmpList();
    showToast(`✓ เพิ่ม "${name}" แล้ว`, 'success');
  }

  function deleteEmployee(index) {
    const employees = loadEmployees();
    const name = employees[index];
    if (!confirm(`ลบ "${name}" ออกจากรายชื่อ?`)) return;
    employees.splice(index, 1);
    saveEmployees(employees);
    renderDropdown();
    renderEmpList();
    showToast(`ลบ "${name}" แล้ว`, 'info');
  }

  function toggleEmpPanel() {
    const panel = document.getElementById('emp-panel');
    const isOpen = panel.classList.contains('open');
    if (isOpen) {
      panel.classList.remove('open');
    } else {
      renderEmpList();
      panel.classList.add('open');
      document.getElementById('emp-add-input').focus();
    }
  }

  function onEmployeeChange() {
    todayStatus = { checkin: false, checkout: false };
    updateSubmitButton();
    const name = document.getElementById('name-input').value.trim();
    if (name) {
      clearTimeout(statusCheckTimeout);
      statusCheckTimeout = setTimeout(() => checkEmployeeStatus(name), 400);
    } else {
      document.getElementById('status-bar').style.display = 'none';
    }
  }

  // ============================================================
  // HISTORY
  // status: 'pending' (กำลังส่ง) | 'success' | 'dup' (มีข้อมูลอยู่แล้ว) | 'error'
  // ============================================================
  function addHistory(name, type, status, driveLink = '', id = null, note = '') {
    const item = {
      id, name, type, status, driveLink, note,
      time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
      date: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })
    };
    history.unshift(item);
    if (history.length > 20) history.pop();
    saveHistory();
    renderHistory();
    return item;
  }

  function updateHistory(id, status, note = '') {
    const h = history.find(x => x.id === id);
    if (!h) return;
    h.status = status;
    h.note = note;
    saveHistory();
    renderHistory();
  }

  function saveHistory() {
    try { localStorage.setItem('checkin_history', JSON.stringify(history)); } catch (e) {}
  }

  const HISTORY_STATUS = {
    pending: { cls: 'pending', label: '⏳ กำลังส่ง' },
    success: { cls: '',        label: '✓ สำเร็จ' },
    dup:     { cls: 'warn',    label: '⚠ มีอยู่แล้ว' },
    error:   { cls: 'err',     label: '✗ ไม่สำเร็จ' }
  };

  function renderHistory() {
    const list = document.getElementById('history-list');
    if (!history.length) {
      list.innerHTML = '<div style="text-align:center;color:var(--text-dim);font-size:13px;padding:16px 0">ยังไม่มีประวัติ</div>';
      return;
    }
    list.innerHTML = history.map(item => {
      const st = HISTORY_STATUS[item.status] || HISTORY_STATUS.error;
      return `
      <div class="history-item">
        <span class="history-badge ${item.type === 'เข้างาน' ? 'badge-in' : 'badge-out'}">${item.type}</span>
        <div class="history-info">
          <div class="history-name">${escapeHTML(item.name)}</div>
          <div class="history-time">${item.date} · ${item.time}</div>
          ${item.note && item.status !== 'success' ? `<div class="history-note" style="${item.status === 'pending' ? 'color:var(--text-dim)' : ''}">${escapeHTML(item.note)}</div>` : ''}
          ${item.driveLink ? `<a href="${item.driveLink}" target="_blank" rel="noopener" style="font-size:11px;color:var(--accent-blue);text-decoration:none;display:inline-flex;align-items:center;gap:3px;margin-top:3px">🔗 ดูรูปภาพ</a>` : ''}
        </div>
        <span class="history-status ${st.cls}">${st.label}</span>
      </div>
    `;
    }).join('');
  }

  function clearHistory() {
    history = [];
    localStorage.removeItem('checkin_history');
    renderHistory();
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ============================================================
  // TOAST
  // ============================================================
  let toastTimer;
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');
    clearTimeout(toastTimer);
    toastMsg.textContent = msg;
    toast.className = 'show ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
    toastTimer = setTimeout(() => { toast.className = ''; }, 3000);
  }



  // ============================================================
  // INIT
  // ============================================================
  window.addEventListener('load', async () => {
    // ส่งรายการที่ค้างจากรอบก่อน (เช่น ปิดแท็บ/เน็ตหลุดก่อนส่งเสร็จ) — ทำก่อน
    // เปิดกล้อง เพราะ startCamera อาจรอสิทธิ์กล้องนาน
    // ประวัติที่ยังค้าง "กำลังส่ง" แต่ไม่มีใน outbox แล้ว (เช่น บันทึกลงเครื่องไม่ได้
    // ตอนนั้น) → ไม่รู้ผลแน่ชัด ให้แจ้งให้ตรวจสอบแทนการค้างสถานะไว้ตลอด
    history.forEach(h => {
      if (h.status === 'pending' && !outbox.some(o => o.id === h.id)) {
        h.status = 'error'; h.note = 'ไม่ทราบผล กรุณาตรวจสอบใน Sheet';
      }
    });
    saveHistory();
    if (outbox.length > 0) processOutbox();

    // First get permission, then enumerate devices for accurate labels
    await startCamera();
    await enumerateDevices();
    loadFaceApi();  // โหลด AI model (background)
    renderHistory();

    // บั๊ค (แก้แล้ว): เดิม renderDropdown() ถูกเรียกหลังลูปกู้คืนชื่อพนักงานด้านล่าง
    // ตอนลูปทำงาน <select> จึงมีแค่ตัวเลือกว่างตัวเดียว (จาก HTML ดิบ) หาไม่เจอ
    // savedName เลยสักครั้ง ฟีเจอร์ "จำชื่อพนักงานล่าสุด" จึงไม่เคยทำงานจริง
    renderDropdown();

    // Restore last selected employee and check status
    const savedName = localStorage.getItem('saved_name');
    if (savedName) {
      const sel = document.getElementById('name-input');
      for (let i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === savedName) {
          sel.selectedIndex = i;
          checkEmployeeStatus(savedName);
          break;
        }
      }
    }

    // Initial type setup
    setType('in');
    updateSubmitButton();
  });
</script>
</body>
</html>
