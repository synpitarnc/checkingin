<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สินพิธาน ชลบุรี · ระบบเข้า-ออกงาน</title>
  <!-- TensorFlow.js + BlazeFace model (ตรวจจับใบหน้าจริง ทุก browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --card: #1a1a24;
      --border: #2a2a3a;
      --accent-in: #00e5a0;
      --accent-out: #ff4d6d;
      --accent-blue: #4d9fff;
      --text: #f0f0f8;
      --text-dim: #7a7a9a;
      --glow-in: rgba(0,229,160,0.18);
      --glow-out: rgba(255,77,109,0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      overflow-x: hidden;
    }

    /* Ambient background */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 60vw;
      height: 60vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(77,159,255,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,160,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== HEADER ===== */
    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-in));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .logo-text {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .logo-text span { color: var(--accent-blue); }

    .clock-badge {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--text-dim);
    }

    #live-clock { color: var(--text); }

    /* ===== MAIN CARD ===== */
    .main-card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    /* ===== TYPE TOGGLE ===== */
    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .type-btn {
      padding: 18px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-family: 'Sarabun', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
    }

    .type-btn::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: transparent;
      transition: background 0.3s ease;
    }

    .type-btn.active-in {
      color: var(--accent-in);
      background: var(--glow-in);
    }
    .type-btn.active-in::after { background: var(--accent-in); }

    .type-btn.active-out {
      color: var(--accent-out);
      background: var(--glow-out);
    }
    .type-btn.active-out::after { background: var(--accent-out); }

    .type-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ===== CAMERA SECTION ===== */
    .camera-section {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .camera-frame {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 16px;
      overflow: hidden;
      background: var(--surface);
      border: 2px solid var(--border);
      position: relative;
      transition: border-color 0.3s ease;
    }

    .camera-frame.active-in-border { border-color: var(--accent-in); box-shadow: 0 0 24px var(--glow-in); }
    .camera-frame.active-out-border { border-color: var(--accent-out); box-shadow: 0 0 24px var(--glow-out); }

    #video-feed, #captured-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      /* Mirror ให้รู้สึกเหมือนส่องกระจก (เหมือน Zoom/FaceTime) — เป็นแค่
         CSS transform ฝั่งแสดงผลเท่านั้น ไม่กระทบข้อมูลรูปจริงที่ถ่าย
         เพราะ canvas.drawImage(video,...) ตอน capturePhoto() ดึงพิกเซลจาก
         สตรีมกล้องตรงๆ ไม่ผ่าน CSS นี้ รูปที่บันทึกลง Sheet จึงยังถูกต้อง
         ตามจริงเหมือนเดิม (ไม่ใช่ภาพกลับด้าน) */
      transform: scaleX(-1);
    }

    #captured-img { display: none; }

    .camera-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Corner brackets */
    .corner { position: absolute; width: 20px; height: 20px; border-color: currentColor; border-style: solid; }
    .corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

    .corner-in { color: var(--accent-in); }
    .corner-out { color: var(--accent-out); }

    .camera-status {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(0,0,0,0.7);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rec-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ff4040;
      animation: blink 1.2s infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* Placeholder when no camera */
    .camera-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text-dim);
    }

    .camera-placeholder svg { opacity: 0.4; }

    /* ===== CAPTURE BUTTON ===== */
    .capture-btn {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 3px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      position: relative;
    }

    .capture-btn:hover { transform: scale(1.05); }
    .capture-btn:active { transform: scale(0.95); }
    .capture-btn:disabled,
    .capture-btn[disabled] {
      opacity: 0.35 !important;
      cursor: not-allowed !important;
      transform: none !important;
      pointer-events: none !important;
    }

    .capture-btn-inner {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s ease;
    }

    .capture-btn.in-mode .capture-btn-inner { background: var(--accent-in); box-shadow: 0 0 16px var(--glow-in); }
    .capture-btn.in-mode { border-color: var(--accent-in); }
    .capture-btn.out-mode .capture-btn-inner { background: var(--accent-out); box-shadow: 0 0 16px var(--glow-out); }
    .capture-btn.out-mode { border-color: var(--accent-out); }

    .retake-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: 'Sarabun', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: none;
    }
    .retake-btn:hover { border-color: var(--text-dim); color: var(--text); }
    .retake-btn.visible { display: block; }

    /* ===== FORM SECTION ===== */
    .form-section {
      padding: 0 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .text-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    .text-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(77,159,255,0.1); }
    .text-input::placeholder { color: var(--text-dim); }

    /* ===== SUBMIT BUTTON ===== */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-family: 'Sarabun', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn.btn-in {
      background: linear-gradient(135deg, #00c87a, #00e5a0);
      color: #001a10;
      box-shadow: 0 8px 32px var(--glow-in);
    }
    .submit-btn.btn-out {
      background: linear-gradient(135deg, #e0304f, #ff4d6d);
      color: #fff;
      box-shadow: 0 8px 32px var(--glow-out);
    }

    .submit-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Saving... gradient blinking text */
    .btn-label-saving {
      background: linear-gradient(90deg, #ffffff, #b3ffe4, #ffffff, #b3ffe4);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: gradientMove 1.4s linear infinite, textBlink 1s ease-in-out infinite;
    }
    .submit-btn.btn-out .btn-label-saving {
      background: linear-gradient(90deg, #ffffff, #ffd6de, #ffffff, #ffd6de);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @keyframes gradientMove {
      0% { background-position: 0% center; }
      100% { background-position: 300% center; }
    }
    @keyframes textBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    /* Loading spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== TOAST ===== */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: var(--accent-in); }
    #toast.error { border-color: var(--accent-out); }
    .toast-icon { font-size: 18px; }

    /* ===== HISTORY ===== */
    .history-section {
      width: 100%;
      max-width: 520px;
      margin-top: 20px;
      position: relative;
      z-index: 1;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .history-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .clear-btn {
      font-size: 12px;
      color: var(--text-dim);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .clear-btn:hover { color: var(--accent-out); }

    #history-list { display: flex; flex-direction: column; gap: 8px; }

    .history-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .history-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .badge-in { background: var(--glow-in); color: var(--accent-in); border: 1px solid rgba(0,229,160,0.3); }
    .badge-out { background: var(--glow-out); color: var(--accent-out); border: 1px solid rgba(255,77,109,0.3); }

    .history-info { flex: 1; min-width: 0; }
    .history-name { font-size: 14px; font-weight: 600; }
    .history-time { font-size: 12px; color: var(--text-dim); font-family: 'Space Mono', monospace; margin-top: 2px; }
    .history-note { font-size: 11px; color: var(--accent-out); margin-top: 3px; }

    .history-status { font-size: 12px; color: var(--accent-in); flex-shrink: 0; }
    .history-status.err { color: var(--accent-out); }
    .history-status.pending { color: var(--text-dim); animation: blink 1.4s infinite; }
    .history-status.warn { color: #ffb84d; }

    /* ===== MANAGE EMPLOYEES ===== */
    .manage-emp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      max-width: 520px;
      padding: 10px;
      border-radius: 12px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: 'Sarabun', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 6px;
      position: relative;
      z-index: 1;
    }
    .manage-emp-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

    .emp-panel {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      display: none;
    }
    .emp-panel.open { display: block; }

    .emp-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 15px;
    }
    .emp-panel-close {
      background: none; border: none; color: var(--text-dim);
      font-size: 20px; cursor: pointer; line-height: 1;
      padding: 0 4px;
      transition: color 0.2s;
    }
    .emp-panel-close:hover { color: var(--accent-out); }

    .emp-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

    .emp-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      animation: slideIn 0.25s ease;
    }
    .emp-item-name { flex: 1; font-size: 14px; }
    .emp-delete-btn {
      background: none; border: none;
      color: var(--text-dim); font-size: 16px; cursor: pointer;
      padding: 2px 6px; border-radius: 6px;
      transition: all 0.2s;
    }
    .emp-delete-btn:hover { background: var(--glow-out); color: var(--accent-out); }

    .emp-add-row {
      display: flex; gap: 8px;
      padding: 0 16px 16px;
    }
    .emp-add-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .emp-add-input:focus { border-color: var(--accent-blue); }
    .emp-add-input::placeholder { color: var(--text-dim); }
    .emp-add-confirm {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent-blue);
      color: #fff;
      font-family: 'Sarabun', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: filter 0.2s;
    }
    .emp-add-confirm:hover { filter: brightness(1.1); }

    /* ===== STATUS BAR ===== */
    .status-bar {
      display: flex;
      gap: 8px;
      padding: 12px 24px 0;
    }
    .status-chip {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      transition: all 0.3s;
    }
    .status-chip.done-in  { background: var(--glow-in);  color: var(--accent-in);  border-color: rgba(0,229,160,0.3); }
    .status-chip.done-out { background: var(--glow-out); color: var(--accent-out); border-color: rgba(255,77,109,0.3); }
    .status-chip.loading  { opacity: 0.5; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .submit-btn:disabled,
    .submit-btn[disabled] {
      opacity: 0.35 !important;
      cursor: not-allowed !important;
      transform: none !important;
      filter: none !important;
      pointer-events: none !important;
      box-shadow: none !important;
    }

    /* ===== EMPLOYEE SELECT ===== */
    .employee-select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 40px 14px 16px;
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      font-size: 15px;
      outline: none;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .employee-select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(77,159,255,0.1);
    }
    .employee-select option { background: var(--card); color: var(--text); }
    .select-wrap {
      position: relative;
    }
    .select-arrow {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-dim);
      font-size: 11px;
    }

    /* ===== CAMERA SELECT ===== */
    .camera-select-wrap {
      width: 100%;
      position: relative;
    }
    .camera-select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 36px 9px 12px;
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      font-size: 13px;
      outline: none;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .camera-select:focus { border-color: var(--accent-blue); }
    .camera-select-icon {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-dim);
      font-size: 12px;
    }

    /* ===== FACE DETECTION ===== */
    #face-canvas {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 3;
    }
    .face-status {
      position: absolute;
      bottom: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      white-space: nowrap;
      z-index: 4;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .face-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s;
    }
    .face-dot.detected { background: var(--accent-in); animation: blink 1s infinite; }
    .face-dot.loading  { background: var(--accent-blue); animation: blink 0.6s infinite; }

    /* ===== CANVAS (hidden) ===== */
    #snapshot-canvas { display: none; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 420px) {
      body { padding: 16px 12px 40px; }
      .camera-section { padding: 16px; }
      .form-section { padding: 0 16px 16px; }
      .logo-text { font-size: 16px; }
    }

    /* ===== SUCCESS POPUP ===== */
    #success-popup {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      pointer-events: none;
      opacity: 0;
    }
    #success-popup.show {
      pointer-events: all;
      animation: popupFadeIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    #success-popup.hide {
      animation: popupFadeOut 0.3s ease forwards;
    }
    @keyframes popupFadeIn {
      from { opacity:0; transform: scale(0.85); }
      to   { opacity:1; transform: scale(1); }
    }
    @keyframes popupFadeOut {
      from { opacity:1; transform: scale(1); }
      to   { opacity:0; transform: scale(0.9); }
    }

    .popup-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(12px);
    }

    .popup-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border-radius: 28px;
      padding: 36px 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    }

    /* Glow ring behind icon */
    .popup-glow {
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 260px; height: 260px;
      border-radius: 50%;
      opacity: 0.18;
      filter: blur(40px);
    }
    .popup-glow.glow-in  { background: var(--accent-in); }
    .popup-glow.glow-out { background: var(--accent-out); }

    /* Confetti particles */
    .popup-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 7px; height: 7px;
      border-radius: 2px;
      opacity: 0;
      animation: particleFly 1.2s ease forwards;
    }
    @keyframes particleFly {
      0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity:1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.2); opacity:0; }
    }

    /* Check / X icon circle */
    .popup-icon-wrap {
      width: 88px; height: 88px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      position: relative;
    }
    .popup-icon-wrap.icon-in  { background: var(--glow-in);  border: 2px solid var(--accent-in); }
    .popup-icon-wrap.icon-out { background: var(--glow-out); border: 2px solid var(--accent-out); }

    .popup-icon-svg {
      animation: iconPop 0.5s cubic-bezier(0.34,1.8,0.64,1) 0.15s both;
    }
    @keyframes iconPop {
      from { transform: scale(0) rotate(-20deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);   opacity: 1; }
    }

    /* Ripple ring */
    .popup-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid currentColor;
      animation: ringPulse 1.4s ease-out 0.2s infinite;
      opacity: 0;
    }
    .popup-icon-wrap.icon-in  .popup-ring { color: var(--accent-in); }
    .popup-icon-wrap.icon-out .popup-ring { color: var(--accent-out); }
    @keyframes ringPulse {
      0%   { transform: scale(1);   opacity: 0.6; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .popup-type {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      animation: slideUp 0.4s ease 0.2s both;
    }
    .popup-type.type-in  { color: var(--accent-in); }
    .popup-type.type-out { color: var(--accent-out); }

    .popup-name {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 6px;
      animation: slideUp 0.4s ease 0.28s both;
    }

    .popup-msg {
      font-size: 15px;
      color: var(--text-dim);
      margin-bottom: 24px;
      animation: slideUp 0.4s ease 0.34s both;
    }

    .popup-time {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      animation: slideUp 0.4s ease 0.4s both;
    }

    .popup-date {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 14px;
      animation: slideUp 0.4s ease 0.44s both;
    }

    /* สถานะการส่งข้อมูลเบื้องหลัง (ใต้วันที่ในป็อปอัพ) */
    .popup-sync {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 20px;
      min-height: 18px;
      text-align: center;
      animation: slideUp 0.4s ease 0.46s both;
    }
    .popup-sync.pending { animation: slideUp 0.4s ease 0.46s both, textBlink 1.2s ease-in-out infinite; }
    .popup-sync.ok-in   { color: var(--accent-in); }
    .popup-sync.ok-out  { color: var(--accent-out); }
    .popup-sync.err     { color: #ffb84d; }

    .popup-close {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-family: 'Sarabun', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      animation: slideUp 0.4s ease 0.5s both;
    }
    .popup-close.close-in  { background: linear-gradient(135deg,#00c87a,#00e5a0); color:#001a10; box-shadow: 0 8px 24px var(--glow-in); }
    .popup-close.close-out { background: linear-gradient(135deg,#e0304f,#ff4d6d); color:#fff;    box-shadow: 0 8px 24px var(--glow-out); }
    .popup-close:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .popup-close:active { transform: translateY(0); }

    @keyframes slideUp {
      from { opacity:0; transform: translateY(14px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* keyframe แยกสำหรับรูปในป็อปอัพโดยเฉพาะ — ต้อง mirror (scaleX(-1)) ให้ตรงกับ
       พรีวิวกล้อง แต่ห้ามใช้ keyframe "slideUp"ร่วมกับ element อื่น เพราะ
       fill-mode:both จะทำให้ transform ตอนจบ animation ทับค่า mirror จนหายไป */
    @keyframes slideUpMirror {
      from { opacity:0; transform: translateY(14px) scaleX(-1); }
      to   { opacity:1; transform: translateY(0) scaleX(-1); }
    }

    /* Photo thumbnail in popup */
    .popup-photo {
      width: 64px; height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      margin-bottom: 14px;
      animation: slideUpMirror 0.4s ease 0.22s both;
    }
  </style>
</head>

      <div class="clock-badge"><span id="live-clock">--:--:--</span></div>

  </header>

  <div class="main-card">
    <!-- Type Toggle -->
    <div class="type-toggle">
      <button class="type-btn active-in" id="btn-checkin" onclick="setType('in')">
        <div class="type-dot"></div> เข้างาน
      </button>
      <button class="type-btn" id="btn-checkout" onclick="setType('out')">
        <div class="type-dot"></div> ออกงาน
      </button>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="status-bar" style="display:none">
      <div class="status-chip loading" id="chip-in">
        <div class="status-dot"></div>
        <span id="chip-in-text">Check-in</span>
      </div>
      <div class="status-chip loading" id="chip-out">
        <div class="status-dot"></div>
        <span id="chip-out-text">Check-out</span>
      </div>
    </div>

    <!-- Camera -->
    <div class="camera-section">
      <div class="camera-frame" id="camera-frame">
        <video id="video-feed" autoplay playsinline muted></video>
        <img id="captured-img" alt="ภาพถ่าย" />
        <canvas id="face-canvas"></canvas>

        <!-- Silhouette guide — ปรับสัดส่วนศีรษะ/ไหล่ให้เป็นธรรมชาติและย่อขนาดลง
             (แก้บั๊ก: เดิม viewBox สูงยาว 200x300 (อัตราส่วน 2:3) ถูกกำหนดขนาด

             ทำให้ความสูงที่คำนวณได้จริงเกินความสูงของกรอบกล้อง เส้นโครงร่าง
             จึงดูใหญ่/ยาวเกินธรรมชาติและล้นออกนอกกรอบด้านล่าง แก้โดยลด viewBox
             ให้เตี้ยลง (200x260) และลด width% ลง เพื่อให้พอดีอยู่ในกรอบ 4:3 โดยไม่ล้น -->

          style="position:absolute;top:50%;left:50%;transform:translate(-50%,-48%);

            C78,16 62,34 60,56
            C58,70 59,82 61,92
            C56,95 53,100 53,106
            C53,113 56,118 61,120

            L29,260 L171,260 L171,209
            C165,187 147,176 132,169
            C126,165 123,158 121,149
            C130,142 136,132 139,120
            C144,118 147,113 147,106
            C147,100 144,95 139,92
            C141,82 142,70 140,56
            C138,34 122,16 100,16 Z
          " fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        </svg>

        <div class="camera-overlay">
          <div class="corner corner-tl corner-in" id="corner-tl"></div>
          <div class="corner corner-tr corner-in" id="corner-tr"></div>
          <div class="corner corner-bl corner-in" id="corner-bl"></div>
          <div class="corner corner-br corner-in" id="corner-br"></div>
          <div class="camera-status" id="cam-status">
            <div class="rec-dot"></div><span>LIVE</span>
          </div>
          <div class="face-status" id="face-status">
            <div class="face-dot loading" id="face-dot"></div>
            <span id="face-status-text">กำลังโหลด AI...</span>
          </div>
        </div>
      </div>
      <canvas id="snapshot-canvas"></canvas>
      <div id="face-hint" style="
        font-size:12px;
        color:var(--accent-blue);
        font-weight:600;
        letter-spacing:0.3px;
        display:none;
        align-items:center;
        gap:5px;
      ">
        <span>🔍</span><span>หันหน้าเข้ากล้องเพื่อถ่ายรูป</span>
      </div>
      <div id="photo-hint" style="
        font-size:12px;
        color:var(--accent-out);
        font-weight:600;
        letter-spacing:0.3px;
        display:flex;
        align-items:center;
        gap:5px;
        animation: blink 1.4s infinite;
      ">
        <span>📷</span><span>กรุณาถ่ายรูปก่อนบันทึก</span>
      </div>

      <div class="camera-select-wrap" id="camera-select-wrap">
        <select class="camera-select" id="camera-select" onchange="switchCamera()">
          <option value="">⏳ กำลังค้นหากล้อง...</option>
        </select>
        <span class="camera-select-icon">▼</span>
      </div>

      <button class="capture-btn in-mode" id="capture-btn" onclick="capturePhoto()">
        <div class="capture-btn-inner"></div>
      </button>
      <button class="retake-btn" id="retake-btn" onclick="retakePhoto()">↩ ถ่ายใหม่</button>
    </div>

    <!-- Form -->
    <div class="form-section">
      <div>
        <div class="field-label">เลือกพนักงาน</div>
        <div class="select-wrap">
          <select class="employee-select" id="name-input" onchange="onEmployeeChange()">
            <option value="">— กรุณาเลือกชื่อ —</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>
      </div>

      <button class="submit-btn btn-in" id="submit-btn" onclick="submitData()">
        <span id="btn-label">✓ บันทึกเข้างาน</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </div>
  </div>

  <!-- Manage Employees -->
  <button class="manage-emp-btn" onclick="toggleEmpPanel()">
    ➕ เพิ่ม / จัดการพนักงาน
  </button>

  <div class="emp-panel" id="emp-panel">
    <div class="emp-panel-header">
      <span>👥 รายชื่อพนักงาน</span>
      <button class="emp-panel-close" onclick="toggleEmpPanel()">✕</button>
    </div>
    <div class="emp-list" id="emp-list"></div>
    <div class="emp-add-row">
      <input class="emp-add-input" id="emp-add-input"
        placeholder="ชื่อพนักงานใหม่ เช่น Ms. Sara Lee (Sara)"
        onkeydown="if(event.key==='Enter') addEmployee()" />
      <button class="emp-add-confirm" onclick="addEmployee()">เพิ่ม</button>
    </div>
  </div>

  <!-- History -->
  <div class="history-section">
    <div class="history-header">
      <div class="history-title">ประวัติล่าสุด</div>
      <button class="clear-btn" onclick="clearHistory()">ลบทั้งหมด</button>
    </div>
    <div id="history-list"></div>
  </div>

  <!-- Success Popup -->
  <div id="success-popup">
    <div class="popup-backdrop" onclick="closeSuccessPopup()"></div>
    <div class="popup-card" id="popup-card">
      <div class="popup-glow" id="popup-glow"></div>
      <div class="popup-particles" id="popup-particles"></div>
      <img class="popup-photo" id="popup-photo" src="" alt="" style="display:none" />
      <div class="popup-icon-wrap" id="popup-icon-wrap">
        <div class="popup-ring"></div>
        <svg class="popup-icon-svg" id="popup-icon-svg" width="44" height="44" viewBox="0 0 44 44" fill="none"></svg>
      </div>
      <div class="popup-type" id="popup-type-label"></div>
      <div class="popup-name" id="popup-name-label"></div>
      <div class="popup-msg"  id="popup-msg-label"></div>
      <div class="popup-time" id="popup-time-label"></div>
      <div class="popup-date" id="popup-date-label"></div>
      <div class="popup-sync" id="popup-sync-label"></div>
      <button class="popup-close" id="popup-close-btn" onclick="closeSuccessPopup()">ตกลง</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"><span class="toast-icon" id="toast-icon">✓</span><span id="toast-msg">บันทึกสำเร็จ</span></div>

<script>
  // ============================================================
  // STATE
  // ============================================================
  let currentType = 'in';
  let stream = null;
  let capturedImageBase64 = null;
  let selectedDeviceId = localStorage.getItem('camera_device_id') || '';
  // Apps Script Web App URL — ตายตัว ไม่มีหน้าตั้งค่าให้แก้จาก UI แล้ว
  // (พนักงานแต่ละคนใช้เครื่องของตัวเอง ไม่จำเป็นต้องตั้งค่าต่างกันต่อเครื่อง)
  // ⚠️ ทุกครั้งที่ redeploy Apps Script เวอร์ชันใหม่ ต้องแก้ค่านี้ให้เป็น
  // URL ล่าสุด แล้วอัปโหลดไฟล์นี้ทับของเดิมบน GitHub Pages
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbztaOfkdabYq1bDKeYwesUpmQXJayh-tD_Mf4rW6sJ7ZbncxiLmneH3vwcdV_cwNNAY/exec';

  let history = JSON.parse(localStorage.getItem('checkin_history') || '[]');

  // ============================================================
  // FACE DETECTION — TensorFlow.js BlazeFace (ทุก browser)
  // ============================================================
  let faceApiReady      = false;
  let faceModel         = null;
  let faceDetectionLoop = null;
  let faceDetected      = false;
  let lastDetections    = [];
  let lastDetectTime    = 0;
  let scanPhase         = 'scanning';
  let scanLineY         = 0;
  let scanComplete      = false;
  let lockedBox         = null;
  let lockFailStreak    = 0; // นับจำนวนครั้งติดกันที่เช็คซ้ำแล้วไม่เจอหน้าตอน locked (กันรีเซ็ตไวเกินจากการตรวจพลาดชั่ววูบ)
  // บั๊ค (แก้แล้ว): เดิมทุกจุดที่เรียก faceModel.estimateFaces(...) ใช้ await
  // ตรงๆ อยู่กลาง requestAnimationFrame loop (detectFaceLoop) ทำให้เฟรมถัดไป
  // ไม่ถูกขอ (requestAnimationFrame) จนกว่า inference (และบางจุดมี
  // setTimeout รออีก 800ms ซ้อนด้วย) จะเสร็จ ผลคือแอนิเมชันเส้นสแกนหยุดค้าง/
  // กระตุกเป็นจังหวะๆ ทุกครั้งที่ตรวจจับใบหน้า (ตอนเส้นวิ่งผ่านกลางภาพ และ
  // ตอนสแกนจบไม่เจอหน้า) — แก้โดยยิง estimateFaces() แบบ fire-and-forget
  // (ไม่ await ใน loop) แล้วใช้ detectionInFlight กันไม่ให้ยิงซ้อนกัน ส่วนการ
  // "หน่วงสั้นๆ ก่อนสแกนใหม่" เปลี่ยนจาก await setTimeout เป็น state 'pausing'
  // ที่เทียบเวลาแบบ non-blocking แทน เพื่อให้ rAF ขอเฟรมถัดไปได้ทุกครั้งไม่สะดุด
  let detectionInFlight = false;
  let pauseUntil        = 0;

  async function loadFaceApi() {
    const statusText = document.getElementById('face-status-text');
    const dot        = document.getElementById('face-dot');
    dot.className    = 'face-dot loading';
    statusText.textContent = 'กำลังโหลด AI...';

    try {
      // รอให้ tf และ blazeface โหลดเสร็จ (สูงสุด 15 วิ)
      let waited = 0;
      while ((!window.tf || !window.blazeface) && waited < 15000) {
        await new Promise(r => setTimeout(r, 200));
        waited += 200;
      }
      if (!window.tf || !window.blazeface) throw new Error('script ไม่โหลด');

      statusText.textContent = 'โหลด model...';
      faceModel = await blazeface.load();
      faceApiReady = true;
      dot.className = 'face-dot';
      statusText.textContent = 'ไม่พบใบหน้า';
      console.log('BlazeFace model loaded ✅');
      updateCaptureButton();

      const video = document.getElementById('video-feed');
      if (stream && video.readyState >= 2) {
        resizeFaceCanvas();
        startFaceDetection();
      }
    } catch(e) {
      console.warn('loadFaceApi error:', e);
      // fallback: scan animation เท่านั้น
      faceApiReady = true;
      faceModel = null;
      dot.className = 'face-dot loading';
      statusText.textContent = 'SCANNING...';
      const video = document.getElementById('video-feed');
      if (stream && video.readyState >= 2) {
        resizeFaceCanvas();
        startFaceDetection();
      }
    }
  }

  function resizeFaceCanvas() {
    const canvas = document.getElementById('face-canvas');
    const frame  = document.getElementById('camera-frame');
    canvas.width  = frame.clientWidth;
    canvas.height = frame.clientHeight;
  }

  function startFaceDetection() {
    if (faceDetectionLoop) cancelAnimationFrame(faceDetectionLoop);
    detectFaceLoop();
  }

  function stopFaceDetection() {
    if (faceDetectionLoop) { cancelAnimationFrame(faceDetectionLoop); faceDetectionLoop = null; }
    const canvas = document.getElementById('face-canvas');
    if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    lastDetections = [];
  }

  async function detectFaceLoop() {
    const video  = document.getElementById('video-feed');
    const canvas = document.getElementById('face-canvas');
    if (!stream || !video || video.paused || video.ended || !faceApiReady || video.style.display === 'none') return;

    const ctx = canvas.getContext('2d');
    const cw = canvas.width, ch = canvas.height;
    const now = Date.now();
    const statusText = document.getElementById('face-status-text');
    const dot        = document.getElementById('face-dot');
    const color      = currentType === 'in' ? '#00e5a0' : '#ff4d6d';

    // ── ไม่มี model: scan overlay เรียบๆ ──────────────────────
    if (!faceModel) {
      ctx.clearRect(0, 0, cw, ch);
      drawScanOverlay(ctx, cw, ch, now);
      faceDetectionLoop = requestAnimationFrame(detectFaceLoop);
      return;
    }

    // ── PHASE: locked — เจอหน้าแล้ว แสดง pulse เบาๆ ให้เห็นว่ายังทำงานอยู่ ──
    if (scanPhase === 'locked') {
      ctx.clearRect(0, 0, cw, ch);

      // บั๊ค (แก้แล้ว): เดิม canvas ว่างเปล่าสนิทตอน locked ทำให้ scan line
      // ที่กำลังเคลื่อนไหวอยู่หายวับไปทันทีที่ล็อกหน้าได้ ดูเหมือน animation
      // ค้าง/หยุดชะงัก ทั้งที่จริงระบบยังทำงานปกติ (แค่ไม่มี feedback ให้เห็น)
      // แก้โดยวาด glow เบาๆ แบบ breathing (สว่าง-หรี่วนต่อเนื่อง) แทนที่จะ
      // ปล่อยว่าง เพื่อให้เห็นว่าเฟรมยังทำงานอยู่ ไม่ใช่ค้าง
      const pulse = 0.5 + Math.sin(now / 500) * 0.5; // วนต่อเนื่อง ~3.1 วิ/รอบ
      ctx.save();
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.18 + pulse * 0.22;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10 + pulse * 10;
      ctx.strokeRect(8, 8, cw - 16, ch - 16);
      ctx.restore();

      // ตรวจซ้ำทุก 800ms ว่าหน้ายังอยู่ไหม — ยิงแบบ fire-and-forget ไม่ await
      // ใน loop (เหตุผลดูคอมเมนต์ตรงประกาศ detectionInFlight ด้านบน)
      if (now - lastDetectTime > 800 && !detectionInFlight) {
        lastDetectTime = now;
        detectionInFlight = true;
        const vw = video.videoWidth||640, vh = video.videoHeight||480;
        const minSize = vh * 0.20;
        faceModel.estimateFaces(video, false).then(preds => {
          const valid = (preds||[]).filter(p => {
            const s=p.probability?.[0]||0, x1=p.topLeft[0], y1=p.topLeft[1], x2=p.bottomRight[0], y2=p.bottomRight[1];
            return s>=0.88 && (x2-x1)>=minSize && (y2-y1)>=minSize &&
                   (x1+x2)/2/vw>=0.15 && (x1+x2)/2/vw<=0.85 &&
                   (y1+y2)/2/vh>=0.20 && (y1+y2)/2/vh<=0.80;
          });
          if (valid.length === 0) {
            // บั๊ค (แก้แล้ว): เดิมพลาดจับหน้าแค่ครั้งเดียว (เช่น กระพริบตา/
            // ก้มหน้าแป๊บเดียว) ก็รีเซ็ตกลับไปหน้าจอ scanning ทันที ทำให้ดู
            // กระตุกไปมาถี่ๆ ระหว่าง "ล็อกแล้ว" กับ "สแกนใหม่" แก้โดยรอให้
            // ไม่เจอหน้า 2 ครั้งติดกัน (~1.6 วิ) ก่อนค่อยรีเซ็ตจริง
            lockFailStreak++;
            if (lockFailStreak >= 2) {
              scanPhase = 'scanning'; scanLineY = 0; scanComplete = false; lockedBox = null;
              faceDetected = false;
              lockFailStreak = 0;
              dot.className = 'face-dot';
              statusText.textContent = 'ไม่พบใบหน้า';
              updateCaptureButton();
              const silR = document.getElementById('face-silhouette');
              if (silR) silR.style.opacity = '0.18';
            }
          } else {
            lockFailStreak = 0;
          }
        }).catch(() => {}).finally(() => { detectionInFlight = false; });
      }
      faceDetectionLoop = requestAnimationFrame(detectFaceLoop);
      return;
    }

    // ── PHASE: pausing — พักสั้นๆ ก่อนเริ่ม scan ใหม่ (เทียบเวลาแบบ
    // non-blocking แทนการ await setTimeout ใน loop เพื่อไม่ให้เฟรมค้าง) ──
    if (scanPhase === 'pausing') {
      ctx.clearRect(0, 0, cw, ch);
      if (now >= pauseUntil) {
        scanPhase = 'scanning'; scanLineY = 0; scanComplete = false; lastDetections = [];
      }
      faceDetectionLoop = requestAnimationFrame(detectFaceLoop);
      return;
    }

    // ── PHASE: scanning — วิ่ง scan line จากบนลงล่าง ──────────
    ctx.clearRect(0, 0, cw, ch);
    scanLineY += 4;

    // scan line gradient
    if (scanLineY < ch + 30) {
      const sg = ctx.createLinearGradient(0, scanLineY-28, 0, scanLineY+28);
      sg.addColorStop(0,   'transparent');
      sg.addColorStop(0.4, color + '20');
      sg.addColorStop(0.5, color + '99');
      sg.addColorStop(0.6, color + '20');
      sg.addColorStop(1,   'transparent');
      ctx.fillStyle = sg;
      ctx.fillRect(0, scanLineY-28, cw, 56);
    }

    // ตรวจจับ 1 ครั้งตอน scan line อยู่กลางภาพ — ยิงแบบ fire-and-forget
    // (ไม่ await ใน loop) เพื่อไม่ให้เฟรมค้างระหว่างรอผล inference ซึ่งเป็น
    // สาเหตุที่เส้นสแกนดูแล๊ก/กระตุกตอนวิ่งผ่านกลางภาพ
    if (scanLineY >= ch*0.38 && scanLineY <= ch*0.52 && !scanComplete && now - lastDetectTime > 200 && !detectionInFlight) {
      lastDetectTime = now;
      scanComplete = true;
      detectionInFlight = true;
      const vw = video.videoWidth||640, vh = video.videoHeight||480;
      const minSize = vh * 0.20;
      faceModel.estimateFaces(video, false).then(preds => {
        const valid = (preds||[]).filter(p => {
          const s=p.probability?.[0]||0, x1=p.topLeft[0], y1=p.topLeft[1], x2=p.bottomRight[0], y2=p.bottomRight[1];
          return s>=0.88 && (x2-x1)>=minSize && (y2-y1)>=minSize &&
                 (x1+x2)/2/vw>=0.15 && (x1+x2)/2/vw<=0.85 &&
                 (y1+y2)/2/vh>=0.20 && (y1+y2)/2/vh<=0.80;
        });
        lastDetections = valid;

        if (valid.length > 0) {
          // บันทึก locked box
          const sx = cw/(video.videoWidth||640), sy = ch/(video.videoHeight||480);
          const p = valid[0], pad = 16;
          lockedBox = {
            x: p.topLeft[0]*sx - pad,
            y: p.topLeft[1]*sy - pad,
            w: (p.bottomRight[0]-p.topLeft[0])*sx + pad*2,
            h: (p.bottomRight[1]-p.topLeft[1])*sy + pad*2,
            score: Math.round((p.probability?.[0]||0.9)*100),
            landmarks: (p.landmarks||[]).map(([lx,ly])=>[lx*sx, ly*sy])
          };
        }
      }).catch(() => { lastDetections = []; }).finally(() => { detectionInFlight = false; });
    }

    // scan line วิ่งจบ → ประเมินผล
    if (scanLineY > ch + 30) {
      if (lockedBox && lastDetections.length > 0) {
        // ✅ เจอหน้า → lock
        faceDetected = true;
        scanPhase = 'locked';
        dot.className = 'face-dot detected';
        statusText.textContent = 'พบใบหน้า ✓ พร้อมถ่าย';
        updateCaptureButton();
        // ซ่อน silhouette เมื่อเจอหน้าแล้ว
        const sil = document.getElementById('face-silhouette');
        if (sil) sil.style.opacity = '0';
      } else if (scanPhase !== 'pausing') {
        // ❌ ไม่พบ → เข้าสถานะพัก 800ms ก่อน scan ใหม่ (แก้บั๊ก: เดิม await
        // estimateFaces() + await setTimeout(800ms) ตรงนี้ค้างเฟรมไว้ทั้งคู่
        // ทำให้ animation หยุดสนิทเป็นจังหวะๆ ทุกรอบที่ไม่เจอหน้า — เปลี่ยน
        // เป็น state 'pausing' ที่ยังขอ rAF ต่อเนื่องแต่ไม่วาดเส้นสแกน แล้ว
        // เทียบเวลาแทนการ await)
        scanPhase = 'pausing';
        pauseUntil = now + 800;
        dot.className = 'face-dot';
        faceDetected = false;
        updateCaptureButton();
        if (!detectionInFlight) {
          detectionInFlight = true;
          faceModel.estimateFaces(video, false).then(rawPreds => {
            statusText.textContent = (rawPreds||[]).length > 0
              ? 'ขยับหน้าเข้ากล้อง / ให้อยู่กลางภาพ'
              : 'ไม่พบใบหน้า';
          }).catch(() => {
            statusText.textContent = 'ไม่พบใบหน้า';
          }).finally(() => { detectionInFlight = false; });
        }
      }
    }

    faceDetectionLoop = requestAnimationFrame(detectFaceLoop);
  }

  // วาด locked box แบบ static ไม่กระพริบ
  function drawLockedBox(ctx, box, color) {
    const {x, y, w, h, score, landmarks} = box;
    const cLen = Math.min(w,h) * 0.22;
    ctx.save();
    // border จาง
    ctx.strokeStyle = color + '40';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
    // corner brackets
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.lineCap = 'round';
    [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([cx,cy,dx,dy])=>{
      ctx.beginPath();
      ctx.moveTo(cx+dx*cLen,cy); ctx.lineTo(cx,cy); ctx.lineTo(cx,cy+dy*cLen);
      ctx.stroke();
    });
    // badge
    ctx.shadowBlur = 0;
    ctx.font = 'bold 10px "Space Mono",monospace';
    const label = `FACE  ${score}%`;
    const tw = ctx.measureText(label).width;
    const bx = x+w/2-tw/2-6, by = y-20;
    ctx.fillStyle = color + 'dd';
    if (ctx.roundRect) ctx.roundRect(bx,by,tw+12,16,3); else ctx.rect(bx,by,tw+12,16);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillText(label, bx+6, by+11);
    // landmarks
    if (landmarks?.length) {
      ctx.fillStyle = color; ctx.globalAlpha = 0.8;
      landmarks.forEach(([lx,ly])=>{ ctx.beginPath(); ctx.arc(lx,ly,2.5,0,Math.PI*2); ctx.fill(); });
    }
    ctx.restore();
  }



  function drawScanOverlay(ctx, cw, ch, now) {
    const color = currentType === 'in' ? '#00e5a0' : '#ff4d6d';
    const scanY = (now / 6) % ch;
    const grad = ctx.createLinearGradient(0, scanY - 32, 0, scanY + 32);
    grad.addColorStop(0,    'transparent');
    grad.addColorStop(0.45, color + '18');
    grad.addColorStop(0.5,  color + '55');
    grad.addColorStop(0.55, color + '18');
    grad.addColorStop(1,    'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, scanY - 32, cw, 64);

    // grid
    ctx.strokeStyle = color + '0c';
    ctx.lineWidth = 1;
    for (let gx = 0; gx < cw; gx += 36) {
      ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,ch); ctx.stroke();
    }
    for (let gy = 0; gy < ch; gy += 36) {
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(cw,gy); ctx.stroke();
    }

    // วาด face guide แทน reticle
  }

  function drawFaceBox(ctx, x, y, w, h, now, score) {
    const color = currentType === 'in' ? '#00e5a0' : '#ff4d6d';
    const pulse = 0.75 + Math.sin(now/380)*0.25;
    const cLen  = Math.min(w, h) * 0.22;

    // scan line
    const scanY = y + ((now/5) % h);
    const sg = ctx.createLinearGradient(x, scanY-16, x, scanY+16);
    sg.addColorStop(0,'transparent'); sg.addColorStop(0.5, color+'44'); sg.addColorStop(1,'transparent');
    ctx.fillStyle = sg;
    ctx.fillRect(x, Math.max(y, scanY-16), w, 32);

    // glow border
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = 16*pulse;
    ctx.strokeStyle = color+'55'; ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
    ctx.restore();

    // corner brackets
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.shadowColor = color; ctx.shadowBlur = 12*pulse;
    ctx.lineCap = 'round';
    [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([cx,cy,dx,dy]) => {
      ctx.beginPath();
      ctx.moveTo(cx+dx*cLen,cy); ctx.lineTo(cx,cy); ctx.lineTo(cx,cy+dy*cLen);
      ctx.stroke();
    });
    ctx.restore();

    // badge
    ctx.save();
    ctx.font = 'bold 10px "Space Mono",monospace';
    const label = `FACE  ${score}%`;
    const tw = ctx.measureText(label).width;
    const bx = x+w/2-tw/2-6, by = y-20;
    ctx.fillStyle = color+'dd';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx,by,tw+12,16,3); else ctx.rect(bx,by,tw+12,16);
    ctx.fill();
    ctx.fillStyle = '#000a';
    ctx.fillText(label, bx+6, by+11);
    ctx.restore();
  }

  window.addEventListener('resize', () => { if (faceApiReady && stream) resizeFaceCanvas(); });

  // ── กู้คืน face detection loop เมื่อกลับมาที่แท็บ/ปลุกหน้าจอ ──────────
  // บั๊ค (แก้แล้ว): เดิม detectFaceLoop() เช็ค `video.paused` แล้ว return เฉยๆ
  // โดยไม่มีใครมา requestAnimationFrame ต่อ ถ้า browser สั่ง pause วิดีโอ
  // อัตโนมัติ (เช่น หน้าจอมือถือ/แท็บเล็ตล็อกเอง, สลับแอปแล้วกลับมา, หรือ
  // แท็บถูก browser suspend เพื่อประหยัดแบตเตอรี่) ลูปจะตายไปเลย ทำให้
  // faceDetected ค้างเป็น false ถาวร → ปุ่มถ่ายรูป (capture-btn) ถูก disable
  // ค้างตลอดไป ทั้งที่ภาพจากกล้องยังแสดงปกติ พนักงานคนถัดไปจะกดถ่ายรูปไม่ได้
  // เลย ต้องสลับกล้องหรือรีโหลดหน้าถึงจะกลับมาใช้งานได้
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && faceApiReady && stream) {
      resizeFaceCanvas();
      startFaceDetection();
    }
  });
  window.addEventListener('focus', () => {
    if (faceApiReady && stream) startFaceDetection();
  });
  document.getElementById('video-feed').addEventListener('play', () => {
    if (faceApiReady && stream) startFaceDetection();
  });

  // ── Watchdog: กู้ loop เผื่อกรณีไม่มี event ไหนมาปลุกเลย ────────────
  // เดิมพึ่งแค่ visibilitychange/focus/play event ซึ่งครอบคลุมเคสหลัก
  // แล้ว แต่บาง WebView บนมือถือ (เช่น ในแอปแชทบางตัว) throttle
  // requestAnimationFrame แบบเงียบๆ โดยไม่ fire event เหล่านี้เลย
  // เช็คทุก 4 วิ ว่า loop ควรวิ่งอยู่แต่ไม่วิ่ง แล้วกู้คืนให้ — ป้องกัน
  // ปุ่มถ่ายรูปค้าง disabled ถาวรเหมือนบั๊คเดิมที่เคยแก้ไปแล้ว
  setInterval(() => {
    const video = document.getElementById('video-feed');
    if (stream && faceApiReady && video && !video.paused &&
        video.style.display !== 'none' && !faceDetectionLoop) {
      console.warn('[watchdog] face detection loop หยุดกลางทาง — กู้คืน');
      resizeFaceCanvas();
      startFaceDetection();
    }
  }, 4000);

  // ============================================================
  // CAMERA
  // ============================================================
  // List all video devices and populate dropdown
  async function enumerateDevices() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');
      const sel = document.getElementById('camera-select');
      sel.innerHTML = '';
      if (videoDevices.length === 0) {
        sel.innerHTML = '<option value="">ไม่พบกล้อง</option>';
        return;
      }
      videoDevices.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `กล้อง ${i + 1}`;
        if (d.deviceId === selectedDeviceId) opt.selected = true;
        sel.appendChild(opt);
      });
      // If no saved device, pick first non-virtual
      if (!selectedDeviceId) {
        const physicalCam = videoDevices.find(d => {
          const lbl = (d.label || '').toLowerCase();
          return !['virtual','obs','snap camera','manycam','droidcam','iriun'].some(k => lbl.includes(k));
        });
        const chosen = physicalCam || videoDevices[0];
        selectedDeviceId = chosen.deviceId;
        sel.value = selectedDeviceId;
      }
    } catch(e) { console.warn('enumerateDevices:', e); }
  }

  async function startCamera(deviceId) {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    const video = document.getElementById('video-feed');
    const frame = document.getElementById('camera-frame');
    const oldPH = frame.querySelector('.camera-placeholder');
    if (oldPH) oldPH.remove();

    const useId = deviceId || selectedDeviceId || null;

    // ลอง constraints หลายแบบ รองรับทุกแพลตฟอร์ม (desktop/mobile/tablet)
    const tryConstraints = [];
    if (useId) {
      tryConstraints.push({ video: { deviceId: { exact: useId } } });
      tryConstraints.push({ video: { deviceId: useId } });
    }
    // mobile: prefer front camera
    tryConstraints.push({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } });
    tryConstraints.push({ video: { facingMode: 'user' } });
    tryConstraints.push({ video: { width: { ideal: 640 }, height: { ideal: 480 } } });
    tryConstraints.push({ video: true });

    let started = false;
    let lastErr = '';
    for (const c of tryConstraints) {
      try {
        const s = await navigator.mediaDevices.getUserMedia(c);
        stream = s;
        const track = stream.getVideoTracks()[0];
        // getSettings() อาจ return {} บน iOS Safari — ต้องตรวจ
        const settings = track.getSettings ? track.getSettings() : {};
        selectedDeviceId = settings.deviceId || useId || '';
        if (selectedDeviceId) localStorage.setItem('camera_device_id', selectedDeviceId);

        const sel = document.getElementById('camera-select');
        if (sel && selectedDeviceId) sel.value = selectedDeviceId;

        video.srcObject = stream;
        video.style.display = 'block';
        document.getElementById('captured-img').style.display = 'none';
        document.getElementById('cam-status').style.display = 'flex';
        started = true;
        // เริ่ม face detection หลัง video พร้อม
        video.addEventListener('loadedmetadata', () => {
          resizeFaceCanvas();
          if (faceApiReady) startFaceDetection();
        }, { once: true });
        break;
      } catch(err) {
        lastErr = err.name + ': ' + err.message;
        console.warn('Camera attempt failed:', lastErr);
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      }
    }

    if (!started) {
      video.style.display = 'none';
      const msg = lastErr.includes('NotAllowedError') || lastErr.includes('Permission')
        ? 'กรุณาอนุญาตการใช้กล้องใน Browser แล้วรีโหลดหน้า'
        : lastErr.includes('NotFoundError') || lastErr.includes('DevicesNotFound')
        ? 'ไม่พบกล้องในอุปกรณ์นี้'
        : 'ไม่สามารถเปิดกล้องได้: ' + lastErr;
      frame.insertAdjacentHTML('beforeend', `
        <div class="camera-placeholder" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;color:var(--text-dim);text-align:center">
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="opacity:0.5">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <span style="font-size:12px;line-height:1.5">${msg}</span>
          <button onclick="startCamera()" style="margin-top:4px;padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;">ลองอีกครั้ง</button>
        </div>`);
    }
  }

  async function switchCamera() {
    const sel = document.getElementById('camera-select');
    selectedDeviceId = sel.value;
    localStorage.setItem('camera_device_id', selectedDeviceId);
    capturedImageBase64 = null;
    faceDetected = false;
    scanPhase = 'scanning'; scanLineY = 0; scanComplete = false; lockedBox = null; lockFailStreak = 0; pauseUntil = 0;
    document.getElementById('retake-btn').classList.remove('visible');
    document.getElementById('capture-btn').style.display = 'flex';
    document.getElementById('photo-hint').style.display  = 'flex';
    updateSubmitButton();
    await startCamera(selectedDeviceId);
  }

  function capturePhoto() {
    const video = document.getElementById('video-feed');
    const canvas = document.getElementById('snapshot-canvas');
    const img = document.getElementById('captured-img');

    if (!stream || !video.srcObject) {
      startCamera();
      return;
    }

    // ล็อค: ต้องตรวจเจอใบหน้าชัดเจนก่อนจึงถ่ายได้
    if (faceApiReady && faceModel) {
      if (!faceDetected) {
        showToast('🔍 ไม่พบใบหน้า กรุณาหันหน้าเข้ากล้อง', 'error');
        return;
      }
      // ตรวจ real-time อีกครั้งก่อนถ่าย (ป้องกันกรณีเจอแค่ครึ่งหน้า)
      if (lastDetections.length === 0) {
        showToast('🔍 กรุณาให้ใบหน้าอยู่ตรงกลางกล้อง', 'error');
        return;
      }
    }

    // ลดขนาดรูปก่อนส่ง เพื่อให้อัปโหลดเร็วขึ้น (รูปสำหรับบันทึกยืนยันตัวตน
    // ไม่จำเป็นต้องละเอียดเต็มความละเอียดกล้อง — กว้างไม่เกิน 480px ก็ชัดพอ)
    const MAX_UPLOAD_WIDTH = 480;
    const vw = video.videoWidth || 640;
    const vh = video.videoHeight || 480;
    const scale = Math.min(1, MAX_UPLOAD_WIDTH / vw);
    canvas.width = Math.round(vw * scale);
    canvas.height = Math.round(vh * scale);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Compress to reasonable size for sending to Apps Script
    capturedImageBase64 = canvas.toDataURL('image/jpeg', 0.5);

    img.src = capturedImageBase64;
    img.style.display = 'block';
    video.style.display = 'none';
    document.getElementById('cam-status').style.display = 'none';
    document.getElementById('retake-btn').classList.add('visible');
    document.getElementById('capture-btn').style.display = 'none';

    stopFaceDetection();
    showToast('📸 ถ่ายรูปสำเร็จ', 'info');
    document.getElementById('photo-hint').style.display = 'none';
    updateSubmitButton();
  }

  function retakePhoto() {
    capturedImageBase64 = null;
    faceDetected = false;
    scanPhase = 'scanning'; scanLineY = 0; scanComplete = false; lockedBox = null; lockFailStreak = 0; pauseUntil = 0;
    const silRet = document.getElementById('face-silhouette');
    if (silRet) silRet.style.opacity = '0.18';
    const video = document.getElementById('video-feed');
    const img = document.getElementById('captured-img');
    video.style.display = 'block';
    img.style.display = 'none';
    document.getElementById('cam-status').style.display = 'flex';
    document.getElementById('retake-btn').classList.remove('visible');
    document.getElementById('capture-btn').style.display = 'flex';
    document.getElementById('photo-hint').style.display = 'flex';
    updateCaptureButton();
    updateSubmitButton();
    // บั๊ค (แก้แล้ว): เดิม loop ตรวจจับใบหน้า (detectFaceLoop) ถูก stop ไว้ตอนถ่ายรูป
    // แล้วไม่มีการ start ใหม่ตรงนี้ ทำให้ faceDetected ค้างเป็น false ตลอดไป
    // กดปุ่มถ่ายรูปใหม่ไม่ได้อีกเลยหลังจากกด "ถ่ายใหม่" ครั้งแรก
    if (faceApiReady && stream) {
      resizeFaceCanvas();
      startFaceDetection();
    }
  }

      document.getElementById('cam-status').style.display = 'flex';
      document.getElementById('retake-btn').classList.remove('visible');
      document.getElementById('capture-btn').style.display = 'flex';
      document.getElementById('photo-hint').style.display  = 'flex';
    }

    if (faceApiReady && stream) {
      scanPhase = 'scanning'; scanLineY = 0; scanComplete = false; lockedBox = null; faceDetected = false; lockFailStreak = 0; pauseUntil = 0;
      const silSt = document.getElementById('face-silhouette');
      if (silSt) silSt.style.opacity = '0.18';

  // Fix corner IDs (simpler approach)
  document.addEventListener('DOMContentLoaded', () => {
